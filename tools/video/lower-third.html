<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Bandeau</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400;1,700&family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    html, body {
      margin: 0;
      width: 1920px;
      height: 1080px;
      background: transparent;
      overflow: hidden;
    }

    .bandeau {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 7rem 6rem 4.5rem;
      background: linear-gradient(0deg,
        rgba(8, 24, 15, 0.92) 0%,
        rgba(8, 24, 15, 0.78) 45%,
        rgba(8, 24, 15, 0) 100%);
    }

    .surtitre {
      font-family: 'Montserrat', sans-serif;
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #D8A64E;
      margin: 0 0 1rem;
    }

    .titre {
      font-family: 'Playfair Display', Georgia, serif;
      font-style: italic;
      font-weight: 700;
      font-size: 5rem;
      line-height: 1.05;
      color: #fff;
      margin: 0;
      text-shadow: 0 4px 24px rgba(0, 0, 0, 0.45);
    }

    .trait {
      width: 110px;
      height: 5px;
      background: #D8A64E;
      border-radius: 999px;
      margin: 1.8rem 0 0;
    }
  </style>
</head>
<body>
  <div class="bandeau">
    <p class="surtitre" id="sur">Le site officiel</p>
    <h1 class="titre" id="tit">Elykia</h1>
    <div class="trait"></div>
  </div>

  <script>
    const p = new URLSearchParams(location.search);
    if (p.get('t')) document.getElementById('tit').textContent = p.get('t');
    if (p.get('s')) document.getElementById('sur').textContent = p.get('s');
  </script>
</body>
</html>
